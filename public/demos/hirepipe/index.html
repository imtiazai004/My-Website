<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HirePipe — Your Pipeline, Moving</title>
<meta name="description" content="HirePipe — live demo by AI Soft Tech Solution. A hiring pipeline with interview scheduling and candidate follow-ups.">
<link rel="canonical" href="https://aisofttechsolution.com/demos/hirepipe">
<meta property="og:title" content="HirePipe — live demo">
<meta property="og:description" content="A hiring pipeline with interview scheduling and candidate follow-ups.">
<meta property="og:image" content="https://aisofttechsolution.com/demos/thumbs/hirepipe.webp">
<meta property="og:url" content="https://aisofttechsolution.com/demos/hirepipe">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',system-ui,sans-serif}
body{background:#eef2ff;min-height:100vh;padding:26px}body.embed{background:transparent!important;padding:0!important;min-height:0!important}body.embed .phone{box-shadow:none!important;border-radius:0!important;padding-top:46px!important}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;margin-bottom:14px}
.top h1{font-size:24px;font-weight:900;color:#1e1b4b}.top h1 span{color:#6366f1}
.alert{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border-radius:16px;padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(124,58,237,.25)}
.alert .big{font-size:26px;font-weight:900}.alert .txt{font-size:13px;font-weight:700;line-height:1.35}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 8px rgba(30,27,75,.08);border-top:3px solid #6366f1}
.stat .sv{font-size:20px;font-weight:900;color:#1e1b4b}.stat .sl{font-size:10.5px;color:#6366f1;font-weight:700}
.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:0 2px 8px rgba(30,27,75,.08);overflow-x:auto}
.tab{flex:1;text-align:center;padding:10px 6px;font-size:12px;font-weight:800;color:#6366f1;border-radius:10px;cursor:pointer;white-space:nowrap}
.tab.on{background:#6366f1;color:#fff}
.card{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(30,27,75,.08)}
.card .hd{display:flex;gap:10px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.info{flex:1}.info b{font-size:14px;color:#1e1b4b;display:block}
.info .meta{font-size:11.5px;color:#6366f1;font-weight:600}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:12px;background:#eef2ff;color:#4338ca;margin-top:5px}
.tag.stale{background:#fee2e2;color:#b91c1c}
.tag.sched{background:#dcfce7;color:#15803d}
.moves{display:flex;gap:6px;margin-top:10px}
.mv{flex:1;border:1.5px solid #c7d2fe;background:#fff;color:#4338ca;font-size:12px;font-weight:800;padding:8px;border-radius:10px;cursor:pointer}
.mv:disabled{opacity:.35;cursor:default}
.mv.fwd{background:#6366f1;border-color:#6366f1;color:#fff}
.acts{display:flex;gap:6px;margin-top:8px}
.abtn{flex:1;border:none;font-size:11.5px;font-weight:800;padding:9px 10px;border-radius:10px;cursor:pointer}
.abtn.i{background:#eef2ff;color:#4338ca}.abtn.f{background:#fef3c7;color:#92400e}
.ivt{font-size:11.5px;font-weight:800;color:#15803d;margin-top:6px}
.empty{background:#fff;border-radius:14px;padding:28px;text-align:center;color:#6366f1;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(30,27,75,.08)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e1b4b;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;font-weight:800;opacity:0;transition:all .3s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:11px;color:#6366f1;font-weight:700;margin-top:14px}
</style>
</head>
<body>
<script>try{if(new URLSearchParams(location.search).get("embed")==="phone")document.body.classList.add("embed")}catch(e){}</script>
<div class="wrap">
  <div class="top"><h1>🎯 Hire<span>Pipe</span></h1></div>
  <div class="alert"><div class="big" id="alertNum">2</div><div class="txt" id="alertTxt">candidates stalled with no contact in 3+ days — they're accepting other offers.</div></div>
  <div class="stats">
    <div class="stat"><div class="sv" id="stTotal">8</div><div class="sl">In pipeline</div></div>
    <div class="stat"><div class="sv" id="stIv">3</div><div class="sl">Interviews set</div></div>
    <div class="stat"><div class="sv" id="stOff">1</div><div class="sl">Offers out</div></div>
  </div>
  <div class="tabs">
    <div class="tab on" id="col0" onclick="setCol(0)">Sourced</div>
    <div class="tab" id="col1" onclick="setCol(1)">Screening</div>
    <div class="tab" id="col2" onclick="setCol(2)">Interview</div>
    <div class="tab" id="col3" onclick="setCol(3)">Offer</div>
  </div>
  <div id="list"></div>
  <div class="foot">HirePipe keeps every candidate moving — no ghosts, no ping-pong.</div>
</div>
<div class="toast" id="toast"></div>
<script>
const COLS=['Sourced','Screening','Interview','Offer'];
let COL=0;
let CAND=[
{id:0,n:'Charles Adams',r:'Senior Frontend Dev',col:0,days:1,stale:false,iv:null},
{id:1,n:'Patricia Baker',r:'UI Designer',col:0,days:5,stale:true,iv:null},
{id:2,n:'Daniel Nelson',r:'Backend Engineer',col:1,days:2,stale:false,iv:null},
{id:3,n:'Barbara Cooper',r:'QA Engineer',col:1,days:6,stale:true,iv:null},
{id:4,n:'Richard Hughes',r:'DevOps Engineer',col:2,days:1,stale:false,iv:'Tue 11:00 AM'},
{id:5,n:'Sarah Turner',r:'Product Designer',col:2,days:2,stale:false,iv:null},
{id:6,n:'Michael Ross',r:'Data Analyst',col:2,days:3,stale:false,iv:'Mon 2:30 PM'},
{id:7,n:'Karen Foster',r:'Project Manager',col:3,days:4,stale:false,iv:null}];
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._x);e._x=setTimeout(()=>e.classList.remove('show'),2400)}
function setCol(c){COL=c;COLS.forEach((_,i)=>document.getElementById('col'+i).classList.toggle('on',i===c));render()}
function move(id,dir){const c=CAND.find(x=>x.id===id);const nc=c.col+dir;if(nc<0||nc>3)return;c.col=nc;c.days=0;c.stale=false;setCol(nc);toast('📦 '+c.n+' → '+COLS[nc])}
function sched(id){const c=CAND.find(x=>x.id===id);const slots=['Mon 10:00 AM','Tue 2:00 PM','Wed 11:30 AM'];const s=slots[(id+c.days)%slots.length];c.iv=s;c.days=0;c.stale=false;render();toast('📅 Interview booked: '+c.n+' — '+s)}
function follow(id){const c=CAND.find(x=>x.id===id);c.days=0;c.stale=false;render();toast('✉️ Follow-up sent to '+c.n+' — nudge delivered')}
function initials(n){return n.split(' ').map(w=>w[0]).join('')}
function card(c){
const tags=`<span class="tag">${c.r}</span> ${c.stale?'<span class="tag stale">⏳ stalled '+c.days+'d</span>':''} ${c.iv?'<span class="tag sched">📅 '+c.iv+'</span>':''}`;
const acts=(COL===2&&!c.iv)?`<div class="acts"><button class="abtn i" onclick="sched(${c.id})">📅 Schedule interview</button></div>`:(c.stale?`<div class="acts"><button class="abtn f" onclick="follow(${c.id})">✉️ Send follow-up</button></div>`:'');
return `<div class="card"><div class="hd"><div class="avatar">${initials(c.n)}</div><div class="info"><b>${c.n}</b><div class="meta">${c.r}</div><div>${tags}</div></div></div><div class="moves"><button class="mv" onclick="move(${c.id},-1)" ${c.col===0?'disabled':''}>← Back</button><button class="mv fwd" onclick="move(${c.id},1)" ${c.col===3?'disabled':''}>Advance →</button></div>${acts}</div>`}
function render(){
const list=document.getElementById('list');
const items=CAND.filter(c=>c.col===COL);
list.innerHTML=items.length?items.map(card).join(''):'<div class="empty">Nobody here yet.<br>Advance candidates from the previous stage.</div>';
const stale=CAND.filter(c=>c.stale).length;
document.getElementById('alertNum').textContent=stale;
document.getElementById('alertTxt').textContent=stale?`candidates stalled with no contact in 3+ days — they're accepting other offers.`:`nobody's waiting on you. Pipeline is moving. 🎉`;
document.getElementById('stTotal').textContent=CAND.length;
document.getElementById('stIv').textContent=CAND.filter(c=>c.iv).length;
document.getElementById('stOff').textContent=CAND.filter(c=>c.col===3).length;
}
render();
</script>
</body>
</html>
