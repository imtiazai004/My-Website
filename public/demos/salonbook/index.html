<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalonBook — Smart Salon Booking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#f7f0e6;min-height:100vh;padding:26px}body.embed{background:transparent!important;padding:0!important;min-height:0!important}body.embed .phone{box-shadow:none!important}
.wrap{max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;margin-bottom:18px}
.top h1{font-size:26px;font-weight:800;color:#831843}.top h1 span{color:#c9a227}
.lang{margin-inline-start:auto;background:#fff;border:1px solid #e7c873;color:#831843;font-size:12px;font-weight:700;padding:7px 14px;border-radius:20px;cursor:pointer}
.vtoggle{display:flex;background:#fff;border:1px solid #e7c873;border-radius:14px;padding:4px;margin-bottom:16px;max-width:380px}
.vtoggle div{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;color:#a08c5b;transition:all .2s}
.vtoggle div.on{background:#831843;color:#fff}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 3px 14px rgba(131,24,67,.07)}
.card h3{font-size:16px;color:#831843;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.svc{border:2px solid #f0e6d2;border-radius:14px;padding:14px;text-align:center;cursor:pointer;transition:all .2s;background:#fffdf8}
.svc:hover{border-color:#c9a227}
.svc.on{border-color:#831843;background:#fdf2f7}
.svc b{display:block;color:#831843;font-size:14px}.svc span{font-size:12px;color:#a08c5b}.svc .pr{font-weight:800;color:#c9a227;margin-top:4px;font-size:14px}
.staffrow{display:flex;gap:10px}
.stf{flex:1;border:2px solid #f0e6d2;border-radius:14px;padding:12px;text-align:center;cursor:pointer;transition:all .2s;background:#fffdf8}
.stf.on{border-color:#831843;background:#fdf2f7}
.stf .sav{width:46px;height:46px;border-radius:50%;background:#831843;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin:0 auto 6px}
.stf b{font-size:13px;color:#831843;display:block}.stf span{font-size:11px;color:#a08c5b}
.datestrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.date{min-width:64px;border:2px solid #f0e6d2;border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;background:#fffdf8;transition:all .2s}
.date.on{border-color:#831843;background:#831843;color:#fff}
.date b{display:block;font-size:15px}.date span{font-size:11px;opacity:.75}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1.5px solid #c9a227;color:#831843;font-weight:600;font-size:13px;padding:9px 15px;border-radius:10px;cursor:pointer;background:#fff;transition:all .2s}
.slot.on{background:#831843;color:#fff;border-color:#831843}
.slot.off{opacity:.35;text-decoration:line-through;cursor:not-allowed;border-color:#ddd;color:#999}
.slot.wait{border-style:dashed;border-color:#c9a227}
input.f{width:100%;padding:12px;border:1.5px solid #f0e6d2;border-radius:12px;font-size:14px;margin-bottom:10px;outline:none}
input.f:focus{border-color:#831843}
.btn{width:100%;background:#831843;color:#fff;border:none;padding:14px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.gold{background:#c9a227;margin-top:10px}
.success{text-align:center;padding:10px}
.success .big{font-size:52px}
.rembox{background:#fdf2f7;border:1px solid #e7c873;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;color:#831843;text-align:start}
.appt{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f5ecd9;font-size:14px}
.appt:last-child{border:none}
.appt .tm{font-weight:800;color:#831843;min-width:70px}
.appt .inf{flex:1}.appt .inf b{display:block;color:#3d2b1f}.appt .inf span{font-size:12px;color:#a08c5b}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.pill.ok{background:#dcfce7;color:#166534}.pill.wait{background:#fef3c7;color:#92400e}
.hist{background:#fffdf8;border:1px solid #f0e6d2;border-radius:12px;padding:12px;margin-top:10px;font-size:13px;color:#3d2b1f}
.hist b{color:#831843}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#831843;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;font-weight:700;opacity:0;transition:all .3s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.view{display:none}.view.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<script>try{if(new URLSearchParams(location.search).get("embed")==="phone")document.body.classList.add("embed")}catch(e){}</script>
<div class="wrap">
  <div class="top"><h1>💇 Salon<span>Book</span></h1><button class="lang" id="langToggle" onclick="setLang(LANG==='en'?'ur':'en')">اردو</button></div>
  <div class="vtoggle"><div id="vtC" class="on" onclick="setView('c')" data-i18n="vCust">Customer view</div><div id="vtO" onclick="setView('o')" data-i18n="vOwn">Owner view</div></div>
  <div class="view active" id="vw-c">
    <div class="card"><h3 data-i18n="s1">1 · Choose a service</h3><div class="grid3" id="svcs"></div></div>
    <div class="card"><h3 data-i18n="s2">2 · Choose your beautician</h3><div class="staffrow" id="staff"></div></div>
    <div class="card"><h3 data-i18n="s3">3 · Pick a day & time</h3><div class="datestrip" id="dates" style="margin-bottom:10px"></div><div class="slots" id="slots"></div></div>
    <div class="card"><h3 data-i18n="s4">4 · Your details</h3><input class="f" id="fName" data-i18n-ph="phName" placeholder="Your name"><input class="f" id="fPhone" data-i18n-ph="phPhone" placeholder="Phone / WhatsApp number"><button class="btn" onclick="confirm()" data-i18n="confirmBtn">Confirm booking ✨</button></div>
    <div class="card view" id="doneCard" style="margin-bottom:14px"><div class="success"><div class="big">✅</div><h3 data-i18n="doneT">Booking confirmed!</h3><p style="font-size:14px;color:#666" id="doneInfo"></p><div class="rembox" id="remPrev"></div><button class="btn gold" onclick="addUpsell()" data-i18n="upsell">💆 Add Hair Spa too — save 20% (Rs 2,560)</button></div></div>
  </div>
  <div class="view" id="vw-o">
    <div class="card"><h3 data-i18n="todayT">📅 Today's appointments</h3><div id="appts"></div></div>
    <div class="card"><h3 data-i18n="histT">👤 Client history — tap an appointment</h3><div id="histBox" style="font-size:13px;color:#a08c5b" data-i18n="histHint">Select an appointment above to see visits, preferences and lifetime spend.</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let LANG='en', svc=0, stf=0, dateI=2, slotI=null, view='c';
const T={
vCust:{en:'Customer view',ur:'گاہک کا منظر'},vOwn:{en:'Owner view',ur:'مالک کا منظر'},
s1:{en:'1 · Choose a service',ur:'1 · سروس منتخب کریں'},s2:{en:'2 · Choose your beautician',ur:'2 · بیوٹیشن منتخب کریں'},
s3:{en:'3 · Pick a day & time',ur:'3 · دن اور وقت منتخب کریں'},s4:{en:'4 · Your details',ur:'4 · آپ کی تفصیل'},
phName:{en:'Your name',ur:'آپ کا نام'},phPhone:{en:'Phone / WhatsApp number',ur:'فون / واٹس ایپ نمبر'},
confirmBtn:{en:'Confirm booking ✨',ur:'بکنگ پکی کریں ✨'},doneT:{en:'Booking confirmed!',ur:'بکنگ پکی ہو گئی!'},
upsell:{en:'💆 Add Hair Spa too — save 20% (Rs 2,560)',ur:'💆 ہیئر اسپا بھی شامل کریں — 20% رعایت (2560 روپے)'},
todayT:{en:"📅 Today's appointments",ur:'📅 آج کی اپائنٹمنٹس'},histT:{en:'👤 Client history — tap an appointment',ur:'👤 گاہک کی ہسٹری — اپائنٹمنٹ دبائیں'},
histHint:{en:'Select an appointment above to see visits, preferences and lifetime spend.',ur:'اوپر اپائنٹمنٹ منتخب کریں — ملاقاتیں، پسند اور کل خرچ دیکھیں۔'},
rem1:{en:'📲 WhatsApp reminder scheduled: 24h before',ur:'📲 واٹس ایپ یاد دہانی: 24 گھنٹے پہلے'},rem2:{en:'📲 WhatsApp reminder scheduled: 2h before',ur:'📲 واٹس ایپ یاد دہانی: 2 گھنٹے پہلے'},
wlT:{en:'This slot is full — join the waitlist?',ur:'یہ وقت بھر چکا — ویٹ لسٹ میں شامل ہوں؟'},wlJ:{en:'Join waitlist',ur:'ویٹ لسٹ میں شامل ہوں'},
full:{en:'FULL',ur:'بھر چکا'}
};
const SVC=[{n:{en:'Haircut & Styling',ur:'بال کٹنگ'},p:800},{n:{en:'Signature Facial',ur:'فیشل'},p:2500},{n:{en:'Hair Spa Ritual',ur:'ہیئر اسپا'},p:3200}];
const STAFF=[{n:{en:'Ayesha',ur:'عائشہ'},s:{en:'Color specialist',ur:'کلر ماہر'}},{n:{en:'Mahnoor',ur:'ماہ نور'},s:{en:'Skin expert',ur:'جلد کی ماہر'}},{n:{en:'Sana',ur:'ثناء'},s:{en:'Bridal artist',ur:'دلہن آرٹسٹ'}}];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],DNUM=[5,6,7,8,9,10,11];
const SLOTS=['11:00 AM','12:30 PM','2:00 PM','3:30 PM','5:00 PM','6:30 PM'];
const APPTS=[{t:'11:00 AM',n:'Fatima Raza',s:'Signature Facial',st:'ok',hist:{v:14,pref:{en:'Sensitive skin · aloe products',ur:'حساس جلد · ایلو مصنوعات'},spend:38500}},{t:'12:30 PM',n:'Hira Shah',s:'Haircut & Styling',st:'ok',hist:{v:9,pref:{en:'Layered cut · prefers Ayesha',ur:'لیئرڈ کٹ · عائشہ کو ترجیح'},spend:12400}},{t:'3:30 PM',n:'Sadia Noor',s:'Hair Spa Ritual',st:'wait',hist:{v:6,pref:{en:'Dry hair · monthly spa',ur:'خشک بال · ماہانہ اسپا'},spend:19800}},{t:'5:00 PM',n:'Areeba Tariq',s:'Signature Facial',st:'wait',hist:{v:3,pref:{en:'First visit last month',ur:'پچھلے ماہ پہلی بار'},spend:7500}}];
function t(k){return T[k]?T[k][LANG]:k}
function setLang(l){LANG=l;document.documentElement.lang=l;document.documentElement.dir=l==='ur'?'rtl':'ltr';
document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n');if(T[k])e.innerHTML=T[k][l]});
document.querySelectorAll('[data-i18n-ph]').forEach(e=>{const k=e.getAttribute('data-i18n-ph');if(T[k])e.placeholder=T[k][l]});
document.getElementById('langToggle').textContent=l==='en'?'اردو':'EN';renderAll()}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._x);e._x=setTimeout(()=>e.classList.remove('show'),2400)}
function setView(v){view=v;document.getElementById('vtC').classList.toggle('on',v==='c');document.getElementById('vtO').classList.toggle('on',v==='o');
document.getElementById('vw-c').classList.toggle('active',v==='c');document.getElementById('vw-o').classList.toggle('active',v==='o')}
function renderAll(){document.getElementById('svcs').innerHTML=SVC.map((s,i)=>`<div class="svc ${svc===i?'on':''}" onclick="svc=${i};renderAll()"><b>${s.n[LANG]}</b><span>45–60 min</span><div class="pr">Rs ${s.p.toLocaleString()}</div></div>`).join('');
document.getElementById('staff').innerHTML=STAFF.map((s,i)=>`<div class="stf ${stf===i?'on':''}" onclick="stf=${i};renderAll()"><div class="sav">${s.n[LANG][0]}</div><b>${s.n[LANG]}</b><span>${s.s[LANG]}</span></div>`).join('');
document.getElementById('dates').innerHTML=DNUM.map((d,i)=>`<div class="date ${dateI===i?'on':''}" onclick="dateI=${i};slotI=null;renderAll()"><b>${d}</b><span>${DAYS[i]}</span></div>`).join('');
document.getElementById('slots').innerHTML=SLOTS.map((s,i)=>{const full=(i+dateI)%3===2;
return full?`<button class="slot wait" onclick="joinWait('${s}')">${s} · ${t('full')}</button>`:`<button class="slot ${slotI===i?'on':''}" onclick="slotI=${i};renderAll()">${s}</button>`}).join('');
document.getElementById('appts').innerHTML=APPTS.map((a,i)=>`<div class="appt" style="cursor:pointer" onclick="showHist(${i})"><div class="tm">${a.t}</div><div class="inf"><b>${a.n}</b><span>${a.s}</span></div><span class="pill ${a.st==='ok'?'ok':'wait'}">${a.st==='ok'?(LANG==='en'?'Confirmed':'پکی'):(LANG==='en'?'Arriving':'آ رہی ہیں')}</span></div>`).join('')}
function joinWait(s){toast('📋 '+(LANG==='en'?'Waitlisted for ':'ویٹ لسٹ: ')+s+' — '+(LANG==='en'?'we will auto-offer you the slot if someone cancels ✓':'منسوخی پر خودکار پیشکش ✓'))}
function showHist(i){const a=APPTS[i];document.getElementById('histBox').innerHTML=`<div class="hist"><b>${a.n}</b> · ${a.s}<br>🗓 ${a.hist.v} visits · 💰 Lifetime spend: Rs ${a.hist.spend.toLocaleString()}<br>💡 ${a.hist.pref[LANG]}</div>`}
function confirm(){const n=document.getElementById('fName').value.trim()||(LANG==='en'?'Guest':'مہمان');
if(slotI===null){toast(LANG==='en'?'Please pick a time slot first':'پہلے وقت منتخب کریں');return}
document.getElementById('doneInfo').innerHTML=`${SVC[svc].n[LANG]} · ${STAFF[stf].n[LANG]} · Oct ${DNUM[dateI]}, ${SLOTS[slotI]}<br><b>Rs ${SVC[svc].p.toLocaleString()}</b> — ${n}`;
document.getElementById('remPrev').innerHTML=t('rem1')+'<br>'+t('rem2');
document.getElementById('doneCard').classList.add('active');document.getElementById('doneCard').scrollIntoView({behavior:'smooth',block:'nearest'})}
function addUpsell(){toast('💆 '+(LANG==='en'?'Hair Spa added — you saved Rs 640 ✓':'ہیئر اسپا شامل — 640 روپے بچت ✓'))}
renderAll();
</script>
</body>
</html>
