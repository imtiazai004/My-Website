<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassFlow — Members Quit in Month 3. See It in Month 1.</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',system-ui,sans-serif}
body{background:#eef2ff;min-height:100vh;padding:26px}body.embed{background:transparent!important;padding:0!important;min-height:0!important}body.embed .wrap{box-shadow:none!important;border-radius:0!important}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{font-size:24px;font-weight:900;color:#1e1b4b}.top h1 span{color:#f97316}
.top .gym{font-size:11px;font-weight:800;color:#6366f1;background:#fff;padding:6px 12px;border-radius:20px;box-shadow:0 2px 8px rgba(30,27,75,.08)}
.alert{background:linear-gradient(135deg,#c2410c,#f97316);color:#fff;border-radius:16px;padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(194,65,12,.25)}
.alert .big{font-size:26px;font-weight:900}.alert .txt{font-size:13px;font-weight:700;line-height:1.35}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 8px rgba(30,27,75,.08);border-top:3px solid #6366f1}
.stat .sv{font-size:20px;font-weight:900;color:#1e1b4b}.stat .sl{font-size:10.5px;color:#6366f1;font-weight:700}
.stat.risk{border-top-color:#dc2626}.stat.risk .sl{color:#dc2626}
.stat.churn{border-top-color:#a8a29e}.stat.churn .sl{color:#78716c}
.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:0 2px 8px rgba(30,27,75,.08)}
.tab{flex:1;text-align:center;padding:10px;font-size:13px;font-weight:800;color:#818cf8;border-radius:10px;cursor:pointer}
.tab.on{background:#4f46e5;color:#fff}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.f{border:1.5px solid #c7d2fe;background:#fff;color:#4338ca;font-size:12px;font-weight:800;padding:7px 13px;border-radius:18px;cursor:pointer}
.f.on{background:#1e1b4b;color:#fff;border-color:#1e1b4b}
.card{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(30,27,75,.08);border-inline-start:5px solid #22c55e}
.card.red{border-color:#dc2626}.card.amber{border-color:#f59e0b}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.red{background:#dc2626;box-shadow:0 0 0 4px #fee2e2}.dot.amber{background:#f59e0b;box-shadow:0 0 0 4px #fef3c7}.dot.green{background:#22c55e;box-shadow:0 0 0 4px #dcfce7}
.memrow{display:flex;gap:10px;align-items:flex-start}
.info{flex:1}.info b{font-size:14px;color:#1e1b4b;display:block}
.info .meta{font-size:11.5px;color:#6366f1;font-weight:600}
.trend{display:flex;gap:3px;align-items:flex-end;margin-top:8px;height:34px}
.bar{width:16px;border-radius:4px;background:#c7d2fe}
.bar.hl{background:#f97316}.bar.dn{background:#dc2626}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:12px;background:#fee2e2;color:#b91c1c;margin-top:5px}
.badge.amber{background:#fef3c7;color:#b45309}
.badge.exp{background:#ede9fe;color:#5b21b6}
.acts{display:flex;flex-direction:column;gap:6px}
.abtn{border:none;font-size:11.5px;font-weight:800;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.abtn.w{background:#22c55e;color:#fff}.abtn.n{background:#ede9fe;color:#5b21b6}
.abtn:disabled{background:#e7e5e4;color:#a8a29e;cursor:default}
.exp-line{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#5b21b6;background:#ede9fe;border-radius:10px;padding:8px 12px;margin-top:8px}
.empty{background:#fff;border-radius:14px;padding:28px;text-align:center;color:#6366f1;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(30,27,75,.08)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e1b4b;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;font-weight:800;opacity:0;transition:all .3s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:11px;color:#818cf8;font-weight:700;margin-top:14px}
</style>
</head>
<body>
<script>try{if(new URLSearchParams(location.search).get("embed")==="phone")document.body.classList.add("embed")}catch(e){}</script>
<div class="wrap">
  <div class="top"><h1>🏋️ Class<span>Flow</span></h1><div class="gym">IronPeak Fitness</div></div>
  <div class="alert"><div class="big" id="alertNum">4</div><div class="txt" id="alertTxt">members are going quiet — their attendance is dropping. Win them back before month 3.</div></div>
  <div class="stats">
    <div class="stat"><div class="sv" id="stActive">128</div><div class="sl">Active members</div></div>
    <div class="stat risk"><div class="sv" id="stRisk">4</div><div class="sl">At churn risk</div></div>
    <div class="stat churn"><div class="sv" id="stChurn">9</div><div class="sl">Churned this month</div></div>
  </div>
  <div class="tabs">
    <div class="tab on" id="memTab" onclick="setTab('mem')">👥 Members</div>
    <div class="tab" id="winTab" onclick="setTab('win')">💬 Win-backs <span id="winCount"></span></div>
    <div class="tab" id="expTab" onclick="setTab('exp')">⏰ Expiring</div>
  </div>
  <div class="filters" id="filterBar">
    <button class="f on" id="filterAll" onclick="setFilter('all')">All</button>
    <button class="f" id="filterRed" onclick="setFilter('red')">🔴 High risk</button>
    <button class="f" id="filterAmber" onclick="setFilter('amber')">🟡 Watch</button>
    <button class="f" id="filterGreen" onclick="setFilter('green')">🟢 Healthy</button>
  </div>
  <div id="list"></div>
  <div class="foot">ClassFlow spots the quitters before they quit.</div>
</div>
<div class="toast" id="toast"></div>
<script>
let TAB='mem', FILT='all';
let MEMBERS=[
{id:0,n:'Daniel Moore',p:'Annual · paid',trend:[5,4,2,1,0],risk:'red',exp:6},
{id:1,n:'Emma White',p:'Monthly · auto-pay',trend:[4,4,3,2,2],risk:'amber',exp:20},
{id:2,n:'Christopher Harris',p:'Quarterly · paid',trend:[3,4,4,5,5],risk:'green',exp:52},
{id:3,n:'Jessica Brown',p:'Monthly · auto-pay',trend:[5,3,2,1,1],risk:'red',exp:11},
{id:4,n:'Michael Davis',p:'Annual · paid',trend:[4,3,4,4,5],risk:'green',exp:140},
{id:5,n:'Sarah Miller',p:'Monthly · auto-pay',trend:[3,3,2,3,2],risk:'amber',exp:8},
{id:6,n:'David Wilson',p:'Quarterly · paid',trend:[2,3,3,4,4],risk:'green',exp:33},
{id:7,n:'Emily Taylor',p:'Monthly · lapsed',trend:[4,2,1,0,0],risk:'red',exp:-3}];
let WINBACKS=[];
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._x);e._x=setTimeout(()=>e.classList.remove('show'),2400)}
function setTab(t){TAB=t;['mem','win','exp'].forEach(x=>document.getElementById(x+'Tab').classList.toggle('on',x===t));document.getElementById('filterBar').style.display=t==='mem'?'flex':'none';render()}
function setFilter(f){FILT=f;['all','red','amber','green'].forEach(x=>document.getElementById('filter'+x[0].toUpperCase()+x.slice(1)).classList.toggle('on',x===f));render()}
function sendWinback(id){const m=MEMBERS.find(x=>x.id===id);if(m.sent)return;m.sent=true;WINBACKS.unshift({n:m.n,msg:'20% off next month + free PT session',t:'just now'});render();toast('💬 WhatsApp offer sent to '+m.n)}
function sendRenew(id){const m=MEMBERS.find(x=>x.id===id);m.renewed=true;render();toast('⏰ Renewal reminder sent to '+m.n)}
function bars(trend,risk){const max=5;return '<div class="trend">'+trend.map(v=>{const h=v?10+v*5:6;const cls=(risk==='red'&&v<=1)||(risk==='amber'&&v<=2)?(v<=1?'dn':'hl'):'';return '<div class="bar '+cls+'" style="height:'+h+'px" title="'+v+' visits"></div>'}).join('')+'</div>'}
function riskBadge(m){if(m.risk==='red')return '<span class="badge">🔴 HIGH CHURN RISK</span>';if(m.risk==='amber')return '<span class="badge amber">🟡 DECLINING — WATCH</span>';return ''}
function card(m){
const acts=m.risk!=='green'&&!m.sent?'<div class="acts"><button class="abtn w" onclick="sendWinback('+m.id+')">💬 Send win-back offer</button></div>':(m.sent?'<div class="acts"><button class="abtn" disabled>✓ Offer sent</button></div>':'');
const exp=m.exp<0?'<div class="exp-line">⚠ Membership lapsed '+(-m.exp)+' days ago</div>':m.exp<=14?'<div class="exp-line">⏰ Expires in '+m.exp+' days <button class="abtn n" style="margin-inline-start:auto" onclick="sendRenew('+m.id+')">'+(m.renewed?'✓ Reminded':'Remind')+'</button></div>':'';
return '<div class="card '+m.risk+'"><div class="memrow"><div class="dot '+m.risk+'"></div><div class="info"><b>'+m.n+'</b><div class="meta">'+m.p+' · 5-week attendance</div>'+bars(m.trend,m.risk)+riskBadge(m)+exp+'</div>'+acts+'</div></div>'}
function render(){
const list=document.getElementById('list');
if(TAB==='mem'){
const ms=MEMBERS.filter(m=>FILT==='all'||m.risk===FILT);
list.innerHTML=ms.length?ms.map(card).join(''):'<div class="empty">No members in this group. 🎉</div>';
}else if(TAB==='win'){
document.getElementById('winCount').textContent=WINBACKS.length?`(${WINBACKS.length})`:'';
list.innerHTML=WINBACKS.length?WINBACKS.map(w=>'<div class="card amber"><div class="memrow"><div class="dot amber"></div><div class="info"><b>'+w.n+'</b><div class="meta">“'+w.msg+'” · sent '+w.t+' via WhatsApp</div><span class="badge amber">⏳ AWAITING RESPONSE</span></div></div></div>').join(''):'<div class="empty">No win-back offers sent yet.<br>Tap “Send win-back offer” on any at-risk member.</div>';
}else{
const ms=MEMBERS.filter(m=>m.exp<=14);
list.innerHTML=ms.length?ms.map(m=>'<div class="card"><div class="memrow"><div class="dot '+(m.exp<0?'red':'amber')+'"></div><div class="info"><b>'+m.n+'</b><div class="meta">'+m.p+'</div>'+(m.exp<0?'<div class="left" style="color:#b91c1c;font-weight:800;margin-top:4px">Lapsed '+(-m.exp)+' days ago — likely churned</div>':'<div class="exp-line">⏰ Expires in '+m.exp+' days <button class="abtn n" style="margin-inline-start:auto" onclick="sendRenew('+m.id+')">'+(m.renewed?'✓ Reminded':'Remind')+'</button></div>')+'</div></div></div>').join(''):'<div class="empty">No memberships expiring soon. 🎉</div>';
}
const risk=MEMBERS.filter(m=>m.risk!=='green'&&!m.sent);
document.getElementById('alertNum').textContent=risk.length;
document.getElementById('alertTxt').textContent=risk.length?`members are going quiet — their attendance is dropping. Win them back before month 3.`:'every member is training strong. Keep it up! 🎉';
document.getElementById('stRisk').textContent=MEMBERS.filter(m=>m.risk!=='green').length;
document.getElementById('stChurn').textContent=9;
}
render();
</script>
</body>
</html>
