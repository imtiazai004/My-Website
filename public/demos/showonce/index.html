<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShowOnce — Show It Once. It Does It Every Day.</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',system-ui,sans-serif}
body{background:#ecfdf5;min-height:100vh;padding:26px}body.embed{background:transparent!important;padding:0!important;min-height:0!important}body.embed .phone{box-shadow:none!important;border-radius:0!important;padding-top:46px!important}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;margin-bottom:14px}
.top h1{font-size:24px;font-weight:900;color:#064e3b}.top h1 span{color:#059669}
.alert{background:linear-gradient(135deg,#064e3b,#059669);color:#fff;border-radius:16px;padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(5,150,105,.3)}
.alert .big{font-size:26px;font-weight:900}.alert .txt{font-size:13px;font-weight:700;line-height:1.35}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 8px rgba(6,78,59,.08);border-top:3px solid #059669}
.stat .sv{font-size:20px;font-weight:900;color:#064e3b}.stat .sl{font-size:10.5px;color:#059669;font-weight:700}
.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:0 2px 8px rgba(6,78,59,.08)}
.tab{flex:1;text-align:center;padding:10px;font-size:12px;font-weight:800;color:#059669;border-radius:10px;cursor:pointer;white-space:nowrap}
.tab.on{background:#059669;color:#fff}
.card{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(6,78,59,.08)}
.card b{font-size:14px;color:#064e3b;display:block}
.card .q{font-size:12.5px;color:#475569;font-weight:600;margin:3px 0 8px}
.card .meta{font-size:11.5px;color:#059669;font-weight:700}
.step{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #ecfdf5}
.step:last-child{border-bottom:none}
.step .n{width:24px;height:24px;border-radius:50%;background:#059669;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step .t{font-size:13px;font-weight:700;color:#064e3b}
.step .s{font-size:11.5px;color:#475569;font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.flag{font-size:10px;font-weight:900;padding:4px 10px;border-radius:12px;white-space:nowrap}
.flag.on{background:#d1fae5;color:#065f46}.flag.off{background:#f1f5f9;color:#64748b}.flag.done{background:#d1fae5;color:#065f46}
.abtn{border:none;font-size:11.5px;font-weight:800;padding:8px 13px;border-radius:10px;cursor:pointer}
.abtn.go{background:#059669;color:#fff}.abtn.ghost{background:#ecfdf5;color:#065f46}.abtn.rec{background:#064e3b;color:#fff}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#064e3b;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;font-weight:800;opacity:0;transition:all .3s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:11px;color:#059669;font-weight:700;margin-top:14px}
.progress{height:8px;background:#ecfdf5;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.progress .bar{height:100%;background:#059669;width:0%;transition:width .6s}
</style>
</head>
<body>
<script>try{if(new URLSearchParams(location.search).get("embed")==="phone")document.body.classList.add("embed")}catch(e){}</script>
<div class="wrap">
  <div class="top"><h1>▶️ Show<span>Once</span></h1></div>
  <div class="alert"><div class="big">👀</div><div class="txt">Recording complete — ShowOnce watched you do this job once. Now it does it for every new order, on its own.</div></div>
  <div class="stats">
    <div class="stat"><div class="sv" id="stJobs">47</div><div class="sl">Jobs run by agent</div></div>
    <div class="stat"><div class="sv" id="stHours">18.5h</div><div class="sl">Hours saved</div></div>
    <div class="stat"><div class="sv" id="stOrders">128</div><div class="sl">Orders logged</div></div>
    <div class="stat"><div class="sv">100%</div><div class="sl">Done right</div></div>
  </div>
  <div class="tabs">
    <div class="tab on" id="recTab" onclick="setTab('rec')">📹 Recorded job</div>
    <div class="tab" id="jobsTab" onclick="setTab('jobs')">⚙️ My jobs</div>
    <div class="tab" id="logTab" onclick="setTab('log')">📊 Job log</div>
  </div>
  <div id="list"></div>
  <div class="foot">ShowOnce — show it once, it does it every day. Maple Street Bakery.</div>
</div>
<div class="toast" id="toast"></div>
<script>
let TAB='rec';
let jobs=47, hours=18.5, orders=128, replayed=false;
const STEPS=[
{t:'WhatsApp order arrives',s:'James Wilson orders 2 sourdough loaves + 1 chocolate cake for Saturday.'},
{t:'Copy the order details',s:'Name, items, quantities and pickup day — copied exactly as the customer wrote them.'},
{t:'Add it to the order sheet',s:'A new row appears in the order sheet, with the total worked out automatically.'},
{t:'Send the confirmation',s:'James gets a friendly confirmation with his pickup time — no typing needed.'}];
const JOBS=[
{n:'WhatsApp order → order sheet',m:'Runs on every new WhatsApp order · saved 11.2 hours',s:'on'},
{n:'Daily stock check',m:'Counts the morning bake against open orders · saved 4.6 hours',s:'on'},
{n:'Payment reminders',m:'Gentle reminder for unpaid orders · saved 2.7 hours',s:'on'},
{n:'Weekend menu post',m:'Posts the weekend menu to the shop page every Friday',s:'off'}];
const LOG=[
{n:'Order #129 — James Wilson',m:'2 sourdough + 1 chocolate cake · logged to sheet · 9:42 AM · saved 6 min'},
{n:'Order #128 — Sophia Bennett',m:'Birthday cake, 12 slices · logged to sheet · 9:18 AM · saved 6 min'},
{n:'Order #127 — Daniel Brooks',m:'6 croissants, pickup today · logged to sheet · 8:55 AM · saved 5 min'},
{n:'Daily stock check',m:'Morning bake counted against 14 open orders · 8:00 AM · saved 12 min'}];
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._x);e._x=setTimeout(()=>e.classList.remove('show'),2600)}
function setTab(t){TAB=t;['rec','jobs','log'].forEach(x=>document.getElementById(x+'Tab').classList.toggle('on',x===t));render()}
function replay(){
  const bar=document.getElementById('progBar');
  if(bar){bar.style.width='100%'}
  if(!replayed){jobs++;hours=+(hours+0.1).toFixed(1);orders++;replayed=true;
    document.getElementById('stJobs').textContent=jobs;
    document.getElementById('stHours').textContent=hours+'h';
    document.getElementById('stOrders').textContent=orders;}
  toast('▶️ Replayed — new order logged to the sheet, confirmation sent');
}
function runJob(i){if(JOBS[i].s!=='on')return;JOBS[i].runs=(JOBS[i].runs||0)+1;jobs++;hours=+(hours+0.1).toFixed(1);document.getElementById('stJobs').textContent=jobs;document.getElementById('stHours').textContent=hours+'h';render();toast('⚙️ '+JOBS[i].n.split(' ')[0]+' job ran — done in seconds')}
function toggleJob(i){JOBS[i].s=JOBS[i].s==='on'?'off':'on';render();toast(JOBS[i].s==='on'?'✅ Job switched on — it will run on its own':'⏸️ Job paused — it will wait for you')}
function recordNew(){toast('🔴 Recording… do the job once, exactly as usual')}
function render(){
const list=document.getElementById('list');
if(TAB==='rec'){
list.innerHTML=`<div class="card"><b>📹 Recorded by Emily Carter — today, 8:02 AM</b><div class="q">One WhatsApp order, copied into the order sheet. ShowOnce learned every step — watch it replay the same job for the next order.</div>${STEPS.map((s,i)=>`<div class="step"><div class="n">${i+1}</div><div><div class="t">${s.t}</div><div class="s">${s.s}</div></div></div>`).join('')}<div class="progress"><div class="bar" id="progBar"></div></div><div class="row"><button class="abtn go" id="replayBtn" onclick="replay()">▶️ Replay this job</button><button class="abtn ghost" id="recBtn" onclick="recordNew()">🔴 Record a new job</button></div></div><div class="card"><b>🤖 What the agent does now</b><div class="q">Every new WhatsApp order is read, copied to the sheet and confirmed — the same four steps, every time, without you touching it.</div></div>`;
}else if(TAB==='jobs'){
list.innerHTML=JOBS.map((j,i)=>`<div class="card"><b>${j.n}</b><div class="q">${j.m}</div><div class="row"><span class="flag ${j.s==='on'?'on':'off'}">${j.s==='on'?'● RUNNING':'○ PAUSED'}</span><button class="abtn go" id="run${i}" onclick="runJob(${i})">▶️ Run now</button><button class="abtn ghost" id="tog${i}" onclick="toggleJob(${i})">${j.s==='on'?'Pause':'Switch on'}</button></div></div>`).join('');
}else{
list.innerHTML=LOG.map(l=>`<div class="card"><b>${l.n}</b><div class="meta">${l.m}</div><div class="row" style="margin-top:6px"><span class="flag done">✅ DONE BY AGENT</span></div></div>`).join('')+`<div class="card"><b>⏱️ 18.5 hours saved so far</b><div class="q">Every job in this log was a task you used to do by hand. ShowOnce did it while you baked.</div></div>`;
}
}
render();
</script>
</body>
</html>
