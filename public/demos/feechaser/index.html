<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FeeChaser — Fees Collected Without the Chasing</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',system-ui,sans-serif}
body{background:#ecfdf5;min-height:100vh;padding:26px}body.embed{background:transparent!important;padding:0!important;min-height:0!important}body.embed .wrap{padding-top:46px}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;margin-bottom:14px}
.top h1{font-size:24px;font-weight:900;color:#065f46}.top h1 span{color:#10b981}
.alert{background:linear-gradient(135deg,#b91c1c,#ef4444);color:#fff;border-radius:16px;padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(185,28,28,.25)}
.alert .big{font-size:26px;font-weight:900}.alert .txt{font-size:13px;font-weight:700;line-height:1.35}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 8px rgba(6,95,70,.08);border-top:3px solid #10b981}
.stat .sv{font-size:19px;font-weight:900;color:#065f46}.stat .sl{font-size:10.5px;color:#5f7a70;font-weight:700}
.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:0 2px 8px rgba(6,95,70,.08)}
.tab{flex:1;text-align:center;padding:10px;font-size:13px;font-weight:800;color:#5f7a70;border-radius:10px;cursor:pointer}
.tab.on{background:#10b981;color:#fff}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.f{border:1.5px solid #a7f3d0;background:#fff;color:#047857;font-size:12px;font-weight:800;padding:7px 13px;border-radius:18px;cursor:pointer}
.f.on{background:#065f46;color:#fff;border-color:#065f46}
.card{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(6,95,70,.08);border-inline-start:5px solid #22c55e;display:flex;gap:10px;align-items:center}
.card.red{border-color:#dc2626}.card.amber{border-color:#f59e0b}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.red{background:#dc2626;box-shadow:0 0 0 4px #fee2e2}.dot.amber{background:#f59e0b;box-shadow:0 0 0 4px #fef3c7}.dot.green{background:#22c55e;box-shadow:0 0 0 4px #dcfce7}
.info{flex:1}.info b{font-size:14px;color:#065f46;display:block}
.info .meta{font-size:11.5px;color:#5f7a70;font-weight:600}
.info .left{font-size:12px;font-weight:800;margin-top:2px}
.left.red{color:#b91c1c}.left.amber{color:#b45309}.left.green{color:#15803d}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:12px;background:#fef3c7;color:#b45309;margin-top:5px}
.badge.paid{background:#dcfce7;color:#15803d}.badge.late{background:#fee2e2;color:#b91c1c}
.acts{display:flex;flex-direction:column;gap:6px}
.abtn{border:none;font-size:11.5px;font-weight:800;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.abtn.w{background:#10b981;color:#fff}.abtn.g{background:#dcfce7;color:#15803d}.abtn:disabled{background:#e2e8f0;color:#94a3b8;cursor:default}
.sum{background:#fff;border-radius:14px;padding:13px 16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(6,95,70,.08);border:1.5px solid #fecaca}
.sum b{color:#b91c1c;font-size:14px;display:block}.sum .m{font-size:12px;color:#5f7a70;font-weight:700;margin-top:3px}
.logcard{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(6,95,70,.08);display:flex;gap:10px;align-items:center}
.logcard .ic{font-size:22px}
.logcard b{font-size:13.5px;color:#065f46;display:block}.logcard .m{font-size:11.5px;color:#5f7a70;font-weight:600}
.empty{background:#fff;border-radius:14px;padding:28px;text-align:center;color:#5f7a70;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(6,95,70,.08)}
.modal{display:none;position:fixed;inset:0;background:rgba(6,95,70,.45);z-index:50;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:380px}
.sheet h3{font-size:17px;font-weight:900;color:#065f46;margin-bottom:6px}
.sheet .sm{font-size:12.5px;color:#5f7a70;font-weight:700;margin-bottom:12px}
.sheet label{font-size:12px;font-weight:800;color:#065f46;display:block;margin-bottom:5px}
.sheet input{width:100%;font-size:18px;font-weight:800;padding:10px 12px;border:2px solid #a7f3d0;border-radius:12px;margin-bottom:14px;color:#065f46;outline:none}
.sheet input:focus{border-color:#10b981}
.srow{display:flex;gap:10px}
.sbtn{flex:1;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800;cursor:pointer}
.sbtn.ok{background:#10b981;color:#fff}.sbtn.no{background:#e7e5e4;color:#5f7a70}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#065f46;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;font-weight:800;opacity:0;transition:all .3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:11px;color:#059669;font-weight:700;margin-top:14px}
</style>
</head>
<body>
<script>try{if(new URLSearchParams(location.search).get("embed")==="phone")document.body.classList.add("embed")}catch(e){}</script>
<div class="wrap">
  <div class="top"><h1>🎒 Fee<span>Chaser</span></h1></div>
  <div class="alert" id="alertBanner"><div class="big" id="alertNum">3</div><div class="txt" id="alertTxt">students overdue — FeeChaser reminds their parents for you.</div></div>
  <div class="stats">
    <div class="stat"><div class="sv" id="stCol">$0</div><div class="sl">Collected this month</div></div>
    <div class="stat"><div class="sv" id="stPend">$0</div><div class="sl">Pending</div></div>
    <div class="stat"><div class="sv" id="stOver">$0</div><div class="sl">Overdue</div></div>
  </div>
  <div class="tabs">
    <div class="tab on" id="stuTab" onclick="setTab('stu')">🎒 Students</div>
    <div class="tab" id="defTab" onclick="setTab('def')">⚠️ Defaulters <span id="defCount"></span></div>
    <div class="tab" id="rcpTab" onclick="setTab('rcp')">🧾 Receipts</div>
  </div>
  <div class="filters" id="filterBar">
    <button class="f on" id="filterAll" onclick="setFilter('all')">All</button>
    <button class="f" id="filterPaid" onclick="setFilter('paid')">🟢 Paid</button>
    <button class="f" id="filterPending" onclick="setFilter('pending')">🟡 Pending</button>
    <button class="f" id="filterOverdue" onclick="setFilter('overdue')">🔴 Overdue</button>
  </div>
  <div id="list"></div>
  <div class="foot">FeeChaser chases every invoice — so teachers don't have to.</div>
</div>
<div class="modal" id="payModal">
  <div class="sheet">
    <h3>Record payment</h3>
    <div class="sm" id="payFor">Olivia Johnson · Grade 8</div>
    <label>Amount received ($)</label>
    <input type="number" id="payAmt" value="200" inputmode="numeric">
    <div class="srow">
      <button class="sbtn no" onclick="closePay()">Cancel</button>
      <button class="sbtn ok" id="payOk" onclick="confirmPay()">✅ Record</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let TAB='stu', FILT='all', PAYID=null, RNUM=1001;
let STU=[
{id:0,n:'Olivia Johnson',c:'Grade 8',f:220,st:'paid'},
{id:1,n:'William Taylor',c:'Grade 5',f:180,st:'overdue',days:9},
{id:2,n:'Sophia Anderson',c:'Grade 10',f:260,st:'pending'},
{id:3,n:'Ethan Brown',c:'Grade 3',f:150,st:'paid'},
{id:4,n:'Ava Miller',c:'Grade 7',f:200,st:'overdue',days:21},
{id:5,n:'Noah Davis',c:'Grade 6',f:175,st:'pending'},
{id:6,n:'Mia Wilson',c:'Grade 4',f:160,st:'overdue',days:5}];
const RCP=[{n:'Olivia Johnson',m:'$220 received · receipt #1000 · 3 days ago'},{n:'Ethan Brown',m:'$150 received · receipt #999 · 4 days ago'}];
function dot(st){return st==='paid'?'green':st==='pending'?'amber':'red'}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._x);e._x=setTimeout(()=>e.classList.remove('show'),2400)}
function setTab(t){TAB=t;['stu','def','rcp'].forEach(x=>document.getElementById(x+'Tab').classList.toggle('on',x===t));document.getElementById('filterBar').style.display=t==='stu'?'flex':'none';render()}
function setFilter(f){FILT=f;['all','paid','pending','overdue'].forEach(x=>document.getElementById('filter'+x[0].toUpperCase()+x.slice(1)).classList.toggle('on',x===f));render()}
function remind(id){const s=STU.find(i=>i.id===id);render();toast('📲 WhatsApp reminder sent to '+s.n+'’s parents')}
function openPay(id){const s=STU.find(i=>i.id===id);PAYID=id;document.getElementById('payFor').textContent=s.n+' · '+s.c;document.getElementById('payAmt').value=s.f;document.getElementById('payModal').classList.add('open')}
function closePay(){document.getElementById('payModal').classList.remove('open')}
function confirmPay(){const s=STU.find(i=>i.id===PAYID);const amt=Math.max(1,parseInt(document.getElementById('payAmt').value)||s.f);s.st='paid';delete s.days;RCP.unshift({n:s.n,m:'$'+amt+' received · receipt #'+(RNUM++)+' · just now'});closePay();render();toast('✅ $'+amt+' recorded for '+s.n+' — receipt issued')}
function card(s){
const d=dot(s.st);
const stLine=s.st==='paid'?'<div class="left green">Paid ✅</div>':s.st==='pending'?'<div class="left amber">Due this week</div>':'<div class="left red">'+s.days+' days overdue</div>';
const badge=s.st==='paid'?'<span class="badge paid">✅ PAID</span>':s.st==='overdue'?'<span class="badge late">⚠ OVERDUE</span>':'<span class="badge">⏳ PENDING</span>';
const acts=s.st==='paid'?'':'<div class="acts"><button class="abtn w" id="remBtn'+s.id+'" onclick="remind('+s.id+')">📲 WhatsApp reminder</button><button class="abtn g" id="payBtn'+s.id+'" onclick="openPay('+s.id+')">💵 Record payment</button></div>';
return '<div class="card '+d+'"><div class="dot '+d+'"></div><div class="info"><b>'+s.n+'</b><div class="meta">'+s.c+' · $'+s.f+'/month</div>'+stLine+badge+'</div>'+acts+'</div>'}
function render(){
const list=document.getElementById('list');
if(TAB==='stu'){
const items=STU.filter(s=>FILT==='all'||s.st===FILT);
list.innerHTML=items.length?items.map(card).join(''):'<div class="empty">No students in this group. 🎉</div>';
}else if(TAB==='def'){
const items=STU.filter(s=>s.st==='overdue');
const total=items.reduce((s,x)=>s+x.f,0);
document.getElementById('defCount').textContent=items.length?'('+items.length+')':'';
const old=items.length?items.reduce((a,b)=>a.days>b.days?a:b):null;
const sum=items.length?'<div class="sum"><b>⚠ Defaulter report — October</b><div class="m">'+items.length+' students owe <b>$'+total+'</b> total · longest overdue: '+old.days+' days ('+old.n+')</div></div>':'';
list.innerHTML=sum+(items.length?items.map(s=>'<div class="card red"><div class="dot red"></div><div class="info"><b>'+s.n+'</b><div class="meta">'+s.c+' · $'+s.f+'/month</div><div class="left red">'+s.days+' days overdue · $'+s.f+' owed</div><span class="badge late">⚠ DEFAULTER</span></div><div class="acts"><button class="abtn w" id="dremBtn'+s.id+'" onclick="remind('+s.id+')">📲 WhatsApp reminder</button><button class="abtn g" id="dpayBtn'+s.id+'" onclick="openPay('+s.id+')">💵 Record payment</button></div></div>').join(''):'<div class="empty">No defaulters. Every fee is in. 🎉</div>');
}else{
list.innerHTML=RCP.length?RCP.map(r=>'<div class="logcard"><div class="ic">🧾</div><div><b>'+r.n+'</b><div class="m">'+r.m+'</div></div></div>').join(''):'<div class="empty">No receipts yet.</div>';
}
const col=STU.filter(s=>s.st==='paid').reduce((s,x)=>s+x.f,0);
const pen=STU.filter(s=>s.st==='pending').reduce((s,x)=>s+x.f,0);
const ov=STU.filter(s=>s.st==='overdue');
document.getElementById('stCol').textContent='$'+col;
document.getElementById('stPend').textContent='$'+pen;
document.getElementById('stOver').textContent='$'+ov.reduce((s,x)=>s+x.f,0);
document.getElementById('alertNum').textContent=ov.length;
document.getElementById('alertTxt').textContent=ov.length?'students overdue — FeeChaser reminds their parents for you.':'all fees collected. Nice work! 🎉';
}
render();
</script>
</body>
</html>
