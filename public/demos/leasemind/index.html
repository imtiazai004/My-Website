<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeaseMind — Rooms Booked, Seats Filled, Invoices Paid</title>
<meta name="description" content="LeaseMind — live demo by Soft Tech Solution. Room and seat booking plus invoicing for co-working spaces.">
<link rel="canonical" href="https://aisofttechsolution.com/demos/leasemind">
<meta property="og:title" content="LeaseMind — live demo">
<meta property="og:description" content="Room and seat booking plus invoicing for co-working spaces.">
<meta property="og:image" content="https://aisofttechsolution.com/demos/thumbs/leasemind.webp">
<meta property="og:url" content="https://aisofttechsolution.com/demos/leasemind">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',system-ui,sans-serif}
body{background:#f5f3ff;min-height:100vh;padding:26px}body.embed{background:transparent!important;padding:0!important;min-height:0!important}body.embed .phone{box-shadow:none!important;border-radius:0!important;padding-top:46px!important}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;margin-bottom:14px}
.top h1{font-size:24px;font-weight:900;color:#2e1065}.top h1 span{color:#8b5cf6}
.alert{background:linear-gradient(135deg,#6d28d9,#a78bfa);color:#fff;border-radius:16px;padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(109,40,217,.25)}
.alert .big{font-size:26px;font-weight:900}.alert .txt{font-size:13px;font-weight:700;line-height:1.35}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 8px rgba(46,16,101,.08);border-top:3px solid #8b5cf6}
.stat .sv{font-size:20px;font-weight:900;color:#2e1065}.stat .sl{font-size:10.5px;color:#8b5cf6;font-weight:700}
.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:0 2px 8px rgba(46,16,101,.08)}
.tab{flex:1;text-align:center;padding:10px;font-size:12px;font-weight:800;color:#8b5cf6;border-radius:10px;cursor:pointer;white-space:nowrap}
.tab.on{background:#8b5cf6;color:#fff}
.room{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(46,16,101,.08)}
.room b{font-size:15px;color:#2e1065;display:block;margin-bottom:2px}
.room .cap{font-size:11.5px;color:#8b5cf6;font-weight:700;margin-bottom:9px}
.slots{display:flex;flex-wrap:wrap;gap:7px}
.slot{font-size:11.5px;font-weight:800;padding:8px 11px;border-radius:10px;border:1.5px solid #ddd6fe;background:#fff;color:#5b21b6;cursor:pointer}
.slot.taken{background:#f1f5f9;border-color:#e2e8f0;color:#94a3b8;cursor:not-allowed;text-decoration:line-through}
.slot.sel{background:#8b5cf6;color:#fff;border-color:#8b5cf6;text-decoration:none}
.warn{background:#fef2f2;border:1.5px solid #fecaca;color:#b91c1c;font-size:12px;font-weight:800;border-radius:12px;padding:11px 14px;margin-bottom:10px}
.grid{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(46,16,101,.08)}
.grid .lbl{font-size:13px;font-weight:800;color:#2e1065;margin-bottom:10px}
.seats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.seat{aspect-ratio:1;border-radius:10px;border:2px solid #ddd6fe;background:#fff;font-size:11px;font-weight:900;color:#5b21b6;cursor:pointer}
.seat.busy{background:#f1f5f9;border-color:#e2e8f0;color:#94a3b8;cursor:not-allowed}
.seat.me{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
.inv{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(46,16,101,.08)}
.inv .row{display:flex;gap:10px;align-items:center}
.inv b{font-size:14px;color:#2e1065;display:block}
.inv .meta{font-size:11.5px;color:#8b5cf6;font-weight:600}
.istag{font-size:10px;font-weight:900;padding:4px 10px;border-radius:12px;white-space:nowrap}
.istag.paid{background:#dcfce7;color:#15803d}.istag.due{background:#fee2e2;color:#b91c1c}.istag.sent{background:#fef3c7;color:#b45309}
.bookbar{display:flex;gap:8px;margin-top:12px}
.bigbtn{flex:1;border:none;background:#8b5cf6;color:#fff;font-size:15px;font-weight:900;padding:15px;border-radius:14px;cursor:pointer;box-shadow:0 6px 18px rgba(139,92,246,.35)}
.bigbtn:disabled{background:#e7e5e4;box-shadow:none;color:#a8a29e;cursor:default}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#2e1065;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;font-weight:800;opacity:0;transition:all .3s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:11px;color:#8b5cf6;font-weight:700;margin-top:14px}
</style>
</head>
<body>
<script>try{if(new URLSearchParams(location.search).get("embed")==="phone")document.body.classList.add("embed")}catch(e){}</script>
<div class="wrap">
  <div class="top"><h1>🏢 Lease<span>Mind</span></h1></div>
  <div class="alert"><div class="big">3</div><div class="txt">meeting rooms booked today — double-book one and two teams show up at the same door.</div></div>
  <div class="stats">
    <div class="stat"><div class="sv">74%</div><div class="sl">Seat occupancy</div></div>
    <div class="stat"><div class="sv">14</div><div class="sl">Bookings today</div></div>
    <div class="stat"><div class="sv" id="stUnpaid">$400</div><div class="sl">Invoices open</div></div>
  </div>
  <div class="tabs">
    <div class="tab on" id="roomTab" onclick="setTab('room')">🗓 Rooms</div>
    <div class="tab" id="seatTab" onclick="setTab('seat')">💺 Seats</div>
    <div class="tab" id="invTab" onclick="setTab('inv')">🧾 Invoices <span id="invN"></span></div>
  </div>
  <div id="warnBox"></div>
  <div id="list"></div>
  <div class="bookbar"><button class="bigbtn" id="bookBtn" onclick="book()">Book selected</button></div>
  <div class="foot">LeaseMind ends double-bookings — every room, seat and invoice in one place.</div>
</div>
<div class="toast" id="toast"></div>
<script>
let TAB='room';
let selRoom=null, selSlot=null, selSeats=[];
const ROOMS=[
{id:0,n:'Sunrise Room',cap:'4 seats · Whiteboard',slots:[{t:'9:00',taken:true},{t:'10:00',taken:false},{t:'11:00',taken:true},{t:'12:00',taken:false},{t:'2:00',taken:true}]},
{id:1,n:'Summit Room',cap:'8 seats · Projector',slots:[{t:'9:00',taken:false},{t:'10:00',taken:true},{t:'11:00',taken:true},{t:'12:00',taken:false},{t:'2:00',taken:false}]},
{id:2,n:'Quiet Pod',cap:'2 seats · Phone booth',slots:[{t:'9:00',taken:true},{t:'10:00',taken:true},{t:'11:00',taken:false},{t:'12:00',taken:false},{t:'2:00',taken:false}]}];
const SEATS=[{id:1,busy:true},{id:2,busy:false},{id:3,busy:false},{id:4,busy:true},{id:5,busy:false},{id:6,busy:true},{id:7,busy:false},{id:8,busy:false},{id:9,busy:false},{id:10,busy:true},{id:11,busy:false},{id:12,busy:true},{id:13,busy:false},{id:14,busy:false},{id:15,busy:true},{id:16,busy:false},{id:17,busy:false},{id:18,busy:false}];
const INV=[
{n:'George Mitchell',m:'Desk 12 · Oct invoice',s:'due',amt:220},
{n:'Nancy Turner',m:'Hot desk x3 days · Oct',s:'sent',amt:180},
{n:'Kenneth Phillips',m:'Summit Room events · Oct',s:'paid',amt:240}];
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._x);e._x=setTimeout(()=>e.classList.remove('show'),2600)}
function setTab(t){TAB=t;['room','seat','inv'].forEach(x=>document.getElementById(x+'Tab').classList.toggle('on',x===t));document.getElementById('warnBox').innerHTML='';render()}
function pick(rid,t){const r=ROOMS.find(x=>x.id===rid);const s=r.slots.find(x=>x.t===t);
if(s.taken){document.getElementById('warnBox').innerHTML='<div class="warn">⛔ Slot taken — <b>'+r.n+' at '+t+'</b> is already booked by the Marketing team. Pick another slot.</div>';toast('⛔ That slot is taken — clash blocked');return}
document.getElementById('warnBox').innerHTML='';selRoom=rid;selSlot=t;selSeats=[];render()}
function pickSeat(id){const s=SEATS.find(x=>x.id===id);if(s.busy)return;selRoom=null;selSlot=null;
const ix=selSeats.indexOf(id);if(ix>=0)selSeats.splice(ix,1);else{if(selSeats.length>=4){toast('Max 4 seats per booking');return}selSeats.push(id)}render()}
function book(){
if(TAB==='room'){
if(selRoom==null||!selSlot){toast('👆 Pick a free room slot first');return}
const r=ROOMS.find(x=>x.id===selRoom);const s=r.slots.find(x=>x.t===selSlot);
if(s.taken){toast('⛔ Clash — that slot was just taken');return}
s.taken=true;const nm=r.n;selRoom=null;selSlot=null;document.getElementById('warnBox').innerHTML='';render();toast('✅ '+nm+' booked — invite sent to your team')}
else if(TAB==='seat'){
if(!selSeats.length){toast('👆 Tap up to 4 free seats');return}
selSeats.forEach(id=>{SEATS.find(x=>x.id===id).busy=true});const n=selSeats.length;selSeats=[];render();toast('✅ '+n+' seat'+(n>1?'s':'')+' booked for today')}
else{toast('🧾 Invoices: tap a name to send a reminder')}
}
function remind(i){if(INV[i].s!=='due')return;INV[i].s='sent';render();toast('📩 Payment reminder sent to '+INV[i].n.split(' ')[0])}
function render(){
const list=document.getElementById('list');
const btn=document.getElementById('bookBtn');
const un=INV.filter(v=>v.s!=='paid').reduce((s,v)=>s+v.amt,0);
document.getElementById('stUnpaid').textContent='$'+un;
if(TAB==='room'){
list.innerHTML=ROOMS.map(r=>`<div class="room"><b>${r.n}</b><div class="cap">${r.cap}</div><div class="slots">${r.slots.map(s=>`<button class="slot ${s.taken?'taken':(selRoom===r.id&&selSlot===s.t?'sel':'')}" id="slot${r.id}_${s.t.replace(':','')}" onclick="pick(${r.id},'${s.t}')">${s.t}</button>`).join('')}</div></div>`).join('');
btn.style.display='';btn.disabled=false;
}else if(TAB==='seat'){
list.innerHTML=`<div class="grid"><div class="lbl">💺 Hot-desk floor — today (green = you)</div><div class="seats">${SEATS.map(s=>`<button class="seat ${s.busy?'busy':(selSeats.includes(s.id)?'me':'')}" onclick="pickSeat(${s.id})">${s.id}</button>`).join('')}</div></div>`;
btn.style.display='';btn.disabled=false;
}else{
list.innerHTML=INV.map((v,i)=>`<div class="inv"><div class="row"><div style="flex:1"><b>${v.n}</b><div class="meta">${v.m} · $${v.amt}</div></div><span class="istag ${v.s}">${v.s==='paid'?'PAID':v.s==='sent'?'REMINDER SENT':'UNPAID'}</span>${v.s==='due'?`<button class="abtn" style="border:none;background:#fee2e2;color:#b91c1c;font-size:11.5px;font-weight:800;padding:8px 13px;border-radius:10px;cursor:pointer" onclick="remind(${i})">📩 Remind</button>`:''}</div></div>`).join('');
btn.style.display='none';
document.getElementById('invN').textContent='('+INV.filter(v=>v.s==='due').length+')';
}
}
render();
</script>
</body>
</html>
