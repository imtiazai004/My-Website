<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptRefill — Never Lose a Patient to an Empty Bottle</title>
<meta name="description" content="ScriptRefill — live demo by Soft Tech Solution. Refill reminders for pharmacies that bring chronic patients back before their medicine runs out.">
<link rel="canonical" href="https://aisofttechsolution.com/demos/scriptrefill">
<meta property="og:title" content="ScriptRefill — live demo">
<meta property="og:description" content="Refill reminders for pharmacies that bring chronic patients back before their medicine runs out.">
<meta property="og:image" content="https://aisofttechsolution.com/demos/thumbs/scriptrefill.webp">
<meta property="og:url" content="https://aisofttechsolution.com/demos/scriptrefill">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',system-ui,sans-serif}
body{background:#ecfdf5;min-height:100vh;padding:26px}body.embed{background:transparent!important;padding:0!important;min-height:0!important}body.embed .phone{box-shadow:none!important;border-radius:0!important;padding-top:46px!important}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;margin-bottom:14px}
.top h1{font-size:24px;font-weight:900;color:#065f46}.top h1 span{color:#10b981}
.alert{background:linear-gradient(135deg,#b91c1c,#ef4444);color:#fff;border-radius:16px;padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(185,28,28,.25)}
.alert .big{font-size:26px;font-weight:900}.alert .txt{font-size:13px;font-weight:700;line-height:1.35}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 8px rgba(6,95,70,.08);border-top:3px solid #10b981}
.stat .sv{font-size:20px;font-weight:900;color:#065f46}.stat .sl{font-size:10.5px;color:#059669;font-weight:700}
.tabs{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:0 2px 8px rgba(6,95,70,.08)}
.tab{flex:1;text-align:center;padding:10px;font-size:13px;font-weight:800;color:#059669;border-radius:10px;cursor:pointer}
.tab.on{background:#10b981;color:#fff}
.card{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(6,95,70,.08);border-inline-start:5px solid #10b981}
.card.overdue{border-color:#dc2626}.card.due{border-color:#f59e0b}
.info{flex:1}.info b{font-size:14px;color:#065f46;display:block}
.info .meta{font-size:11.5px;color:#059669;font-weight:600}
.info .left{font-size:12px;font-weight:800;margin-top:2px}
.left.red{color:#b91c1c}.left.amber{color:#b45309}.left.green{color:#15803d}
.streak{display:inline-block;font-size:10.5px;font-weight:900;padding:3px 10px;border-radius:12px;margin-top:6px;background:#fef3c7;color:#b45309}
.streak.hot{background:#dcfce7;color:#15803d}
.row{display:flex;gap:10px;align-items:center}
.acts{display:flex;flex-direction:column;gap:6px}
.abtn{border:none;font-size:11.5px;font-weight:800;padding:9px 13px;border-radius:10px;cursor:pointer;white-space:nowrap}
.abtn.s{background:#10b981;color:#fff}.abtn.r{background:#fee2e2;color:#b91c1c}.abtn:disabled{background:#e7e5e4;color:#a8a29e;cursor:default}
.logcard{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(6,95,70,.08);display:flex;gap:10px;align-items:center}
.logcard .ic{font-size:22px}.logcard b{font-size:13.5px;color:#065f46;display:block}.logcard .m{font-size:11.5px;color:#059669;font-weight:600}
.empty{background:#fff;border-radius:14px;padding:28px;text-align:center;color:#059669;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(6,95,70,.08)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#065f46;color:#fff;padding:12px 22px;border-radius:30px;font-size:13px;font-weight:800;opacity:0;transition:all .3s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{text-align:center;font-size:11px;color:#059669;font-weight:700;margin-top:14px}
</style>
</head>
<body>
<script>try{if(new URLSearchParams(location.search).get("embed")==="phone")document.body.classList.add("embed")}catch(e){}</script>
<div class="wrap">
  <div class="top"><h1>💊 Script<span>Refill</span></h1></div>
  <div class="alert"><div class="big" id="alertNum">3</div><div class="txt" id="alertTxt">refills are overdue — these patients are walking to the pharmacy next door.</div></div>
  <div class="stats">
    <div class="stat"><div class="sv" id="stSent">18</div><div class="sl">Reminders sent</div></div>
    <div class="stat"><div class="sv" id="stRec">11</div><div class="sl">Refills recovered</div></div>
    <div class="stat"><div class="sv" id="stRate">61%</div><div class="sl">Recovery rate</div></div>
  </div>
  <div class="tabs">
    <div class="tab on" id="dueTab" onclick="setTab('due')">⏰ Refills due</div>
    <div class="tab" id="sentTab" onclick="setTab('sent')">📩 Sent log</div>
  </div>
  <div id="list"></div>
  <div class="foot">ScriptRefill watches every refill date — you don't have to.</div>
</div>
<div class="toast" id="toast"></div>
<script>
let TAB='due';
let PAT=[
{id:0,n:'Robert Wright',m:'Atorvastatin 20mg · 30 tablets',d:-3,sent:false,streak:8},
{id:1,n:'Jennifer Scott',m:'Metformin 500mg · 60 tablets',d:-1,sent:false,streak:5},
{id:2,n:'Thomas Green',m:'Amlodipine 10mg · 30 tablets',d:-1,sent:true,streak:12},
{id:3,n:'Margaret Hale',m:'Levothyroxine 75mcg · 30 tablets',d:1,sent:false,streak:4},
{id:4,n:'William Ford',m:'Losartan 50mg · 30 tablets',d:2,sent:false,streak:6},
{id:5,n:'Elizabeth Shaw',m:'Omeprazole 20mg · 28 capsules',d:4,sent:false,streak:9},
{id:6,n:'James Carter',m:'Simvastatin 40mg · 30 tablets',d:6,sent:false,streak:2}];
const LOG=[{n:'Susan Blake',m:'Gabapentin 300mg',t:'09:12 AM'}];
let sent=18,rec=11;
function dueLabel(d){return d<0?('Overdue by '+(-d)+' day'+(-d>1?'s':'')):d===0?'Due today':('Due in '+d+' day'+(d>1?'s':''))}
function cls(d){return d<0?'red':d<=2?'amber':'green'}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(e._x);e._x=setTimeout(()=>e.classList.remove('show'),2400)}
function setTab(t){TAB=t;['due','sent'].forEach(x=>document.getElementById(x+'Tab').classList.toggle('on',x===t));render()}
function sendRem(id){const p=PAT.find(x=>x.id===id);if(p.sent)return;p.sent=true;sent++;LOG.unshift({n:p.n,m:p.m.split('·')[0].trim(),t:'now'});render();toast('📩 SMS/WhatsApp reminder sent to '+p.n.split(' ')[0])}
function refilled(id){const p=PAT.find(x=>x.id===id);p.sent=true;rec++;LOG.unshift({n:p.n,m:p.m.split('·')[0].trim(),t:'now (recovered)'});render();toast('✅ '+p.n+' collected the refill — streak saved')}
function card(p){const c=cls(p.d);const fire=p.streak>=5;
const acts=`<div class="acts"><button class="abtn s" id="remBtn${p.id}" onclick="sendRem(${p.id})" ${p.sent?'disabled':''}>${p.sent?'✓ Sent':'📩 Send reminder'}</button>${p.d<0&&!p.sent?`<button class="abtn r" onclick="refilled(${p.id})">✅ Mark refilled</button>`:''}</div>`;
return `<div class="card ${p.d<0?'overdue':p.d<=2?'due':''}"><div class="row"><div class="info"><b>${p.n}</b><div class="meta">${p.m}</div><div class="left ${c}">${dueLabel(p.d)}</div><span class="streak ${fire?'hot':''}">${fire?'🔥':'⭐'} ${p.streak}-month adherence streak</span></div>${acts}</div></div>`}
function render(){
const list=document.getElementById('list');
if(TAB==='due'){
const items=[...PAT].sort((a,b)=>a.d-b.d);
list.innerHTML=items.length?items.map(card).join(''):'<div class="empty">All refills on track. 🎉</div>';
}else{
list.innerHTML=LOG.length?LOG.map(l=>`<div class="logcard"><div class="ic">📩</div><div><b>${l.n}</b><div class="m">${l.m} · reminder ${l.t}</div></div></div>`).join(''):'<div class="empty">No reminders sent yet.</div>';
}
const od=PAT.filter(p=>p.d<0&&!p.sent).length;
document.getElementById('alertNum').textContent=od;
document.getElementById('alertTxt').textContent=od?`refills are overdue — these patients are walking to the pharmacy next door.`:`no overdue refills. Every patient covered. 🎉`;
document.getElementById('stSent').textContent=sent;
document.getElementById('stRec').textContent=rec;
document.getElementById('stRate').textContent=Math.round(rec/sent*100)+'%';
}
render();
</script>
</body>
</html>
